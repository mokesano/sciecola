# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main", "master", "develop", "production" ]
  pull_request:
    branches: [ "main", "master", "develop", "production" ]
  schedule:
    - cron: '0 4 * * 1' # Setiap Senin pukul 04:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    
    steps:
      # Langkah 1: Checkout kode
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Penting untuk analisis diff yang akurat

      # Langkah 2: Jalankan Codacy Analysis CLI
      # Kita tidak lagi membutuhkan env: CODACY_PROJECT_TOKEN karena menggunakan GitHub App Integration
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          # Opsional: Tentukan tool yang ingin dijalankan, atau biarkan kosong untuk semua
          # tools: eslint,bandit
          
          # Opsional: Format output untuk diupload ke GitHub Code Scanning
          format: sarif
          output: results.sarif
          
          # Biarkan verbose untuk debugging jika diperlukan
          verbose: true

      # Langkah 3: Upload hasil SARIF ke GitHub Code Scanning
      - name: Upload SARIF results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always() # Pastikan langkah ini jalan meski analisis sebelumnya ada warning
        with:
          sarif_file: results.sarif
          category: codacy
