# Konfigurasi Codacy untuk sdgs-mapper (PHP + React/JS)

# --- Tools yang diaktifkan ---
engines:
  # PHP Tools
  phpstan:
    enabled: true
    level: 5  # 1-8, semakin tinggi semakin ketat
    exclude_paths:
      - vendor/**
      - library/**
      - includes/config.php
      
  phpcs:
    enabled: true
    standard: "PSR12"  # Sesuai standar modern PHP
    exclude_paths:
      - vendor/**
      - db/migrations/**
      
  security/php-security-scanner:
    enabled: true
    
  # JavaScript/React Tools
  eslint:
    enabled: true
    config_file: "frontend-src/.eslintrc.json"  # Jika ada
    exclude_paths:
      - frontend-src/node_modules/**
      - frontend-src/dist/**
      - frontend-src/build/**
      
  complexity:
    enabled: true
    exclude_paths:
      - vendor/**
      - frontend-src/node_modules/**
      
  duplication:
    enabled: true
    exclude_paths:
      - vendor/**
      - frontend-src/node_modules/**
      - db/schema.sql

# --- File/folder yang diabaikan ---
exclude_paths:
  - vendor/**
  - frontend-src/node_modules/**
  - frontend-src/dist/**
  - frontend-src/build/**
  - db/*.sql
  - docs/**
  - "*.md"
  - "UI-design/**"
  - "tools/**"
  - composer.lock
  - package-lock.json

# --- Thresholds (opsional) ---
# Batas minimal kualitas sebelum Codacy memberi warning
checks:
  duplication:
    enabled: true
    threshold: 10  # Maks 10% kode duplikat
  complexity:
    enabled: true
    threshold: 15  # Maks complexity score 15 per fungsi