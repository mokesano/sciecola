<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 16 16" class="anim-rotate" aria-hidden="true" role="img" xmlns:c2pa="http://c2pa.org/manifest">
    <!-- Berputar sendiri (1 putaran/detik, seperti GitHub) juga saat dipakai sebagai <img>:
         kelas anim-rotate milik GitHub tidak punya CSS di luar github.com. -->
    <style>
        @keyframes sc-git-rotate { to { transform: rotate(360deg); } }
        .sc-spin { transform-origin: 8px 8px; animation: sc-git-rotate 1s linear infinite; }
    </style>
    <g class="sc-spin">
        <path opacity=".5" d="M8 15A7 7 0 108 1a7 7 0 000 14v0z" stroke="#d29922" stroke-width="2"></path>
        <path d="M15 8a7 7 0 01-7 7" stroke="#d29922" stroke-width="2"></path>
        <path d="M8 12a4 4 0 100-8 4 4 0 000 8z" fill="#d29922"></path>
    </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
