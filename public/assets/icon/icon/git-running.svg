<svg aria-label="currently running" width="100%" height="100%" fill="none" viewBox="0 0 16 16" class="anim-rotate" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Berputar sendiri (1 putaran/detik, seperti GitHub) juga saat dipakai sebagai <img>:
       kelas anim-rotate milik GitHub tidak punya CSS di luar github.com. -->
  <style>
    @keyframes sc-git-rotate { to { transform: rotate(360deg); } }
    .sc-spin { transform-origin: 8px 8px; animation: sc-git-rotate 1s linear infinite; }
  </style>
  <g class="sc-spin">
    <path fill="none" stroke="#d29922" stroke-width="2" d="M3.05 3.05a7 7 0 1 1 9.9 9.9 7 7 0 0 1-9.9-9.9Z" opacity=".5"></path>
    <path fill="#d29922" fill-rule="evenodd" d="M8 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" clip-rule="evenodd"></path>
    <path fill="#d29922" d="M14 8a6 6 0 0 0-6-6V0a8 8 0 0 1 8 8h-2Z"></path>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
