<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{notification_title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color:#f3f4f6;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:600px;background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.07);">

          <!-- Header -->
          <tr>
            <td style="background-color:#4F46E5;padding:32px 40px;text-align:center;">
              <span style="color:#ffffff;font-size:26px;font-weight:700;letter-spacing:1px;">SCIECOLA</span>
              <p style="margin:6px 0 0;color:#c7d2fe;font-size:13px;letter-spacing:0.5px;">SDGs Research Analytics Platform</p>
            </td>
          </tr>

          <!-- Notification badge -->
          <tr>
            <td style="padding:32px 40px 0;text-align:center;">
              <span style="display:inline-block;background-color:#eef2ff;color:#4F46E5;font-size:12px;font-weight:600;padding:6px 16px;border-radius:20px;letter-spacing:0.5px;text-transform:uppercase;">
                Notifikasi
              </span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:20px 40px 32px;">
              <h1 style="margin:0 0 16px;font-size:20px;font-weight:700;color:#1e1b4b;text-align:center;">{{notification_title}}</h1>

              <div style="font-size:15px;color:#4b5563;line-height:1.7;text-align:left;">
                {{notification_body}}
              </div>

              <!-- Optional CTA (renders only when cta_text and cta_url are provided) -->
              <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="margin-top:32px;">
                <tr>
                  <td align="center">
                    <a href="{{cta_url}}"
                       style="display:inline-block;background-color:#4F46E5;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;padding:14px 36px;border-radius:10px;letter-spacing:0.3px;">
                      {{cta_text}}
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 40px;">
              <hr style="border:none;border-top:1px solid #e5e7eb;margin:0;" />
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 40px;text-align:center;">
              <p style="margin:0 0 8px;font-size:12px;color:#9ca3af;line-height:1.6;">
                Ini adalah notifikasi otomatis dari Sciecola.<br />
                Mohon jangan balas email ini.
              </p>
              <p style="margin:0;font-size:12px;color:#d1d5db;">
                &copy; Sciecola &mdash; SDGs Research Analytics Platform
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
